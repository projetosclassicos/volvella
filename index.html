<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volvella Grammatica — Morfologia Grega Multicamadas</title>
  <meta name="description" content="Instrumento filológico rotativo de três discos concêntricos para síntese morfológica dos verbos do Grego Antigo pelas Seis Partes Principais." />
  <meta property="og:title" content="Volvella Grammatica — Morfologia Grega Multicamadas" />
  <meta property="og:description" content="Instrumento filológico rotativo de três discos concêntricos para síntese morfológica dos verbos do Grego Antigo pelas Seis Partes Principais." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <style id="volvella-css">
    :root {
      --font-greek: "Cormorant Garamond", "Gentium Plus", "EB Garamond", "Palatino Linotype", Palatino, "Book Antiqua", "GFS Didot", "Noto Serif", "DejaVu Serif", "Liberation Serif", Georgia, "Times New Roman", serif;
      --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;

      --bg-page: #FAF9F5;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F5F3EE;
      --bg-warm: #FAF6EC;
      --ink-950: #141210;
      --ink-900: #1C1917;
      --ink-700: #44403C;
      --ink-600: #57534E;
      --ink-500: #78716C;
      --ink-400: #A8A29E;
      --border-200: #E7E5E0;
      --border-300: #D6D3D1;

      --pigment: #6B1D2F;
      --pigment-hover: #561625;
      --pigment-muted: #9E5A68;
      --pigment-soft: rgba(107, 29, 47, 0.08);
      --paper-d1: #FDFCF8;
      --paper-d2: #F4EFE4;
      --paper-d3: #EAE3D3;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-page);
      color: var(--ink-900);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      background: transparent;
      border: none;
    }

    .font-greek {
      font-family: var(--font-greek);
      font-feature-settings: "kern" 1, "liga" 1;
    }

    .font-mono {
      font-family: var(--font-mono);
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Top Bar Contract (Marca — Navegação — Ações) */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 24px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-200);
      flex-wrap: wrap;
    }

    .brand-link {
      font-family: var(--font-greek);
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--pigment);
      text-decoration: none;
      white-space: nowrap;
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 22px;
      overflow-x: auto;
    }

    .nav-tab {
      padding: 6px 2px;
      font-size: 0.86rem;
      font-weight: 500;
      color: var(--ink-600);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .nav-tab:hover {
      color: var(--ink-900);
    }

    .nav-tab.active {
      color: var(--ink-950);
      font-weight: 600;
      border-bottom-color: var(--pigment);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 6px;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn-primary {
      background-color: var(--pigment);
      color: #FFFFFF;
      border: 1px solid var(--pigment);
    }

    .btn-primary:hover {
      background-color: var(--pigment-hover);
      border-color: var(--pigment-hover);
    }

    .btn-secondary {
      background-color: #FAF9F6;
      color: var(--ink-700);
      border: 1px solid var(--border-300);
    }

    .btn-secondary:hover {
      background-color: #F0EEE8;
      color: var(--ink-950);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.74rem;
    }

    /* Layout Principal de 2 Zonas */
    .studio-main {
      max-width: 1640px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px 36px;
      display: grid;
      grid-template-columns: minmax(0, 7.6fr) minmax(360px, 4.4fr);
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 1080px) {
      .studio-main {
        grid-template-columns: 1fr;
        padding: 16px;
      }
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-200);
      border-radius: 12px;
      padding: 20px;
    }

    .stage-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .toolbar-row {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid #F1EFEA;
    }

    .segmented-group {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: #F1EFEA;
      border: 1px solid var(--border-200);
      border-radius: 8px;
    }

    .seg-btn {
      padding: 6px 11px;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--ink-600);
      border-radius: 6px;
      white-space: nowrap;
      transition: all 0.14s ease;
    }

    .seg-btn:hover {
      color: var(--ink-950);
    }

    .seg-btn.active {
      background: #FFFFFF;
      color: var(--pigment);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    .verb-stepper {
      display: inline-flex;
      align-items: center;
      background: var(--bg-page);
      border: 1px solid var(--border-300);
      border-radius: 7px;
    }

    .step-arrow {
      padding: 7px 10px;
      color: var(--ink-600);
      font-size: 0.9rem;
    }

    .step-arrow:hover {
      color: var(--ink-950);
    }

    .verb-select {
      border: none;
      background: transparent;
      padding: 6px 8px;
      font-family: var(--font-greek);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink-950);
      cursor: pointer;
      outline: none;
      max-width: 320px;
    }

    .swatch-row {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .swatch-dot {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      opacity: 0.72;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .swatch-dot:hover {
      opacity: 1;
    }

    .swatch-dot.active {
      opacity: 1;
      transform: scale(1.22);
      box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px var(--ink-400);
    }

    .volvella-svg-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0;
    }

    .volvella-svg {
      width: 100%;
      height: auto;
      max-width: 860px;
      max-height: 860px;
      user-select: none;
    }

    .svg-clickable {
      cursor: pointer;
    }

    .stage-footer {
      width: 100%;
      padding-top: 12px;
      margin-top: 8px;
      border-top: 1px solid #F1EFEA;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--ink-500);
    }

    /* Painel Direito: Lupa Óptica Hueber e Editores */
    .aside-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .loupe-outer-d3 {
      padding: 6px;
      border-radius: 12px;
      border: 2px solid var(--ink-700);
      background: #EFECE4;
      display: grid;
      grid-template-columns: 5fr 7fr;
      gap: 5px;
      align-items: stretch;
    }

    .loupe-cutout-d2 {
      padding: 4px;
      border-radius: 6px;
      border: 1px dashed var(--pigment);
      background: rgba(214, 211, 209, 0.45);
      display: flex;
      align-items: stretch;
    }

    .loupe-cell-d1 {
      width: 100%;
      padding: 12px 10px 12px 8px;
      border-radius: 2px;
      border: 1px solid var(--border-300);
      background: #FFFDF9;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .loupe-plate-d2 {
      padding: 10px 11px;
      border-radius: 6px;
      border: 1px solid var(--border-300);
      background: var(--bg-warm);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .triad-list {
      border: 1px solid var(--border-200);
      border-radius: 8px;
      overflow: hidden;
    }

    .triad-item {
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      background: #FFFFFF;
      border-bottom: 1px solid #F1EFEA;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: background-color 0.14s ease;
    }

    .triad-item:last-child {
      border-bottom: none;
    }

    .triad-item:hover {
      background: #FAF9F6;
    }

    .triad-item.active {
      background: var(--pigment-soft);
    }

    .win-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    @media (max-width: 520px) {
      .win-grid {
        grid-template-columns: 1fr;
      }
    }

    .win-btn {
      padding: 8px 11px;
      text-align: left;
      border-radius: 6px;
      border: 1px solid var(--border-200);
      background: #FFFFFF;
      font-size: 0.76rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .win-btn:hover {
      background: #FAF9F6;
    }

    .win-btn.active {
      border-color: var(--pigment);
      background: var(--pigment-soft);
      font-weight: 600;
      color: var(--ink-950);
    }

    /* Inputs e Formulários dos Editores */
    .field-label {
      display: block;
      font-size: 0.71rem;
      font-weight: 600;
      color: var(--ink-600);
      margin-bottom: 4px;
    }

    .text-input, .num-input, .select-input, .code-textarea {
      width: 100%;
      padding: 6px 9px;
      font-size: 0.82rem;
      background: #FFFFFF;
      border: 1px solid var(--border-300);
      border-radius: 5px;
      outline: none;
    }

    .text-input:focus, .num-input:focus, .select-input:focus, .code-textarea:focus {
      border-color: var(--ink-900);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .grid-5 {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.74rem;
    }

    .data-table th, .data-table td {
      padding: 6px 10px;
      text-align: left;
      border-bottom: 1px solid #F1EFEA;
    }

    .data-table th {
      background: #FAF9F6;
      color: var(--ink-600);
      font-weight: 600;
      border-bottom: 1px solid var(--border-200);
    }

    .notice-ok {
      padding: 8px 12px;
      border-radius: 6px;
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      color: #065F46;
      font-size: 0.76rem;
      font-weight: 500;
    }

    .notice-err {
      padding: 8px 12px;
      border-radius: 6px;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #991B1B;
      font-size: 0.76rem;
    }

    /* Visualização e Impressão A4 em Escala Real (1:1 mm) */
    .print-studio-bg {
      min-height: 100vh;
      background: #E7E5E0;
      padding-bottom: 40px;
    }

    .print-toolbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border-300);
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .print-pages-stack {
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .volvella-print-page {
      width: 210mm;
      height: 296mm;
      background: #FFFFFF;
      border: 1px solid var(--border-300);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1);
      padding: 8mm 8mm 7mm 8mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .hidden-print-mount {
      display: none;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 0mm;
      }

      html, body {
        width: 210mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #FFFFFF !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .no-print {
        display: none !important;
      }

      .hidden-print-mount {
        display: block !important;
      }

      .print-studio-bg {
        background: #FFFFFF !important;
        padding: 0 !important;
      }

      .print-pages-stack {
        padding: 0 !important;
        gap: 0 !important;
        display: block !important;
      }

      .volvella-print-page {
        width: 210mm !important;
        height: 296mm !important;
        margin: 0 auto !important;
        padding: 8mm 8mm 7mm 8mm !important;
        border: none !important;
        box-shadow: none !important;
        page-break-after: always;
        break-after: page;
        page-break-inside: avoid;
        break-inside: avoid;
        overflow: hidden !important;
      }

      .volvella-print-page:last-child {
        page-break-after: auto;
        break-after: auto;
      }
    }
  </style>
</head>

      function computeNestedBoxMetrics(win) {
        var totalWidth = win.stemWidth + win.desinenceWidth;
        var seamX = (win.stemWidth - win.desinenceWidth) / 2;
        var d3Outer = { x: -totalWidth / 2, y: -win.height / 2, width: totalWidth, height: win.height, rx: 3.2 };
        var d2Inset = 2.0;
        var d2Height = Math.max(12, win.height - d2Inset * 2);
        var d2Envelope = { x: -totalWidth / 2 + d2Inset, y: -d2Height / 2, width: Math.max(28, totalWidth - d2Inset * 2), height: d2Height, rx: 1.8 };
        var d2Cutout = { x: -totalWidth / 2 + d2Inset, y: -d2Height / 2, width: Math.max(14, win.stemWidth - d2Inset - 0.5), height: d2Height, rx: 1.5 };
        var d2Plate = { x: seamX + 0.5, y: -d2Height / 2, width: Math.max(18, win.desinenceWidth - d2Inset - 0.5), height: d2Height, rx: 1.5 };
        var d1InsetX = 1.6;
        var d1InsetY = 1.5;
        var d1Width = Math.max(11, d2Cutout.width - d1InsetX * 2);
        var d1Height = Math.max(9, d2Cutout.height - d1InsetY * 2);
        var d1StemCell = { x: d2Cutout.x + d1InsetX, y: -d1Height / 2, width: d1Width, height: d1Height, rx: 1.0 };

        return {
          totalWidth: totalWidth,
          seamX: seamX,
          d3Outer: d3Outer,
          d2Envelope: d2Envelope,
          d2Cutout: d2Cutout,
          d2Plate: d2Plate,
          d1StemCell: d1StemCell

      function computeRotationalState(verbIndex, totalVerbs, voice, preferredVoiceStepDeg) {
        var safeTotal = Math.max(1, totalVerbs);
        var deltaVerbDeg = 360 / safeTotal;
        var maxSafeVoiceStep = Math.min(20, Number((deltaVerbDeg / 3.2).toFixed(2)));
        var voiceStepDeg = Math.min(preferredVoiceStepDeg, maxSafeVoiceStep);
        var thetaVerbDeg = Number((verbIndex * deltaVerbDeg).toFixed(2));
        var mult = VOICE_METADATA[voice].stepMultiplier;
        var thetaVoiceDeg = Number((mult * voiceStepDeg).toFixed(2));
        var disc1StemCompensationDeg = Number((-(thetaVerbDeg + thetaVoiceDeg)).toFixed(2));
        var disc2DesinenceCompensationDeg = Number((-thetaVoiceDeg).toFixed(2));

        return {
          verbIndex: verbIndex,
          voice: voice,
          deltaVerbDeg: Number(deltaVerbDeg.toFixed(2)),
          thetaVerbDeg: thetaVerbDeg,
          voiceStepDeg: voiceStepDeg,
          thetaVoiceDeg: thetaVoiceDeg,
          disc1StemCompensationDeg: disc1StemCompensationDeg,
          disc2DesinenceCompensationDeg: disc2DesinenceCompensationDeg

      }

      function exportMatrixAsSemicolonCSV(verbs, windows, preferredVoiceStepDeg, system) {

        var headers = [

        ].concat(windows.map(function (w) { return w.id + '_' + w.slotKey; }));

        var rows = [headers.join(';')];

        VOICES_ORDER.forEach(function (voice) {
          var rot = computeRotationalState(0, verbs.length, voice, preferredVoiceStepDeg);
          var rowNum = rows.length + 1;
          var plateCells = windows.map(function (win) {
            var plate = platesMap[win.slotKey][voice];
            return '"' + plate.plateLines.join(' | ').replace(/"/g, '""') + '"';
          });
          rows.push([
            'DISCO_2_DESINENCIAS', systemTag, 'UNIVERSAL',
            system === 'mi' ? 'Chave_Atematica_MI' : 'Chave_Tematica_OMEGA',
            VOICE_METADATA[voice].label, '0',
            String(rot.thetaVoiceDeg).replace('.', ','),
            '=-G' + rowNum,
            String(rot.disc2DesinenceCompensationDeg).replace('.', ',')
          ].concat(plateCells).join(';'));
        });

        verbs.forEach(function (verb, vIdx) {
          VOICES_ORDER.forEach(function (voice) {
            var rot = computeRotationalState(vIdx, verbs.length, voice, preferredVoiceStepDeg);
            var rowNum = rows.length + 1;
            var stemCells = windows.map(function (win) {
              var reading = readOpticalWindow(verb, voice, win.slotKey, system);

            rows.push([

              VOICE_METADATA[voice].label,
              String(rot.thetaVerbDeg).replace('.', ','),
              String(rot.thetaVoiceDeg).replace('.', ','),

              String(rot.disc1StemCompensationDeg).replace('.', ',')

        });

      function stepDiscAnimation() {

        anim.disc1Deg = settled1 ? anim.disc1Deg + diff1 : anim.disc1Deg + diff1 * 0.18;

      function renderHueberStemSvg(stem, cell, kerningPx, fill, cellFill, cellStroke, opacity) {

        var rightPad = Math.max(1.0, Math.min(2.6, 0.9 + (kerningPx - 0.4) * 0.55));
        var textRightX = cell.x + cell.width - rightPad;
        var maxSafeWidth = Math.max(13, textRightX - (cell.x + 1.4));
        var idealFontSize = Math.min(11.4, cell.height * 0.55);
        var effectiveFontSize = Math.max(8.2, Math.min(idealFontSize, maxSafeWidth / Math.max(1, displayStem.length * 0.54)));
        var clampAttrs = (displayStem.length * effectiveFontSize * 0.55 > maxSafeWidth)
          ? ' textLength="' + maxSafeWidth.toFixed(1) + '" lengthAdjust="spacingAndGlyphs"'
          : '';

      /* =========================================================================
         7. AUTO-SERIALIZAÇÃO DO ARQUIVO HTML ÚNICO PARA DOWNLOAD / CÓPIA OFFLINE
         ========================================================================= */
      function buildStandaloneUnifiedHtml(embedState) {
        var cssEl = document.getElementById('volvella-css');
        var jsEl = document.getElementById('volvella-js');
        var cssCode = cssEl ? cssEl.textContent : '';
        var jsCode = jsEl ? jsEl.textContent : '';

        var closeStyleTag = ['</st', 'yle>'].join('');
        var closeScriptTag = ['</scr', 'ipt>'].join('');
        var openComment = ['<!', '--'].join('');

        var persistedPayload = embedState
          ? JSON.stringify({
              decks: state.decks,
              activeDeckId: state.activeDeckId,
              windows: state.windows,
              pigmentId: state.pigmentId,
              preferredVoiceStepDeg: state.preferredVoiceStepDeg,
              kerningPx: state.kerningPx
            }).split(closeScriptTag).join('<\\/script>').split(openComment).join('<\\!--')
          : 'null';

        return [
          '<!doctype html>',
          '<html lang="pt-BR">',
          '<head>',
          '  <meta charset="UTF-8" />',
          '  <meta name="viewport" content="width=device-width, initial-scale=1.0" />',
          '  <title>Volvella Grammatica — Morfologia Grega Multicamadas</title>',
          '  <meta name="description" content="Instrumento filológico rotativo de três discos concêntricos para síntese morfológica dos verbos do Grego Antigo pelas Seis Partes Principais." />',
          '  <style id="volvella-css">' + cssCode.split(closeStyleTag).join('<\\/style>') + closeStyleTag,
          '</head>',
          '<body>',
          '  <div id="app"></div>',
          '  <script id="volvella-state">window.__VOLVELLA_SAVED_STATE__ = ' + persistedPayload + ';' + closeScriptTag,
          '  <script id="volvella-js">' + jsCode + closeScriptTag,
          '</body>',
          '</html>',
          ''
        ].join('\n');
      }

      function triggerDownloadBlob(content, filename, mimeType) {
        var blob = new Blob([content], { type: mimeType });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
        return Math.round((blob.size / 1024) * 10) / 10;
      }

                    '<select data-input="print-scale" class="select-input" style="width:auto;display:inline-block;margin-left:4px;">' +
                      '<option value="a4_optimal"' + (state.printScaleId === 'a4_optimal' ? ' selected' : '') + '>' + SCALE_PRESETS.a4_optimal.label + '</option>' +
                      '<option value="compact_safe"' + (state.printScaleId === 'compact_safe' ? ' selected' : '') + '>' + SCALE_PRESETS.compact_safe.label + '</option>' +
                    '</select>' +
                  '</label>' +
                '</div>' +
                '<button type="button" data-action="trigger-browser-print" class="btn btn-primary">Imprimir (' + printBundle.totalPages + ' Folhas A4)</button>' +
              '</div>' +
              '<div class="no-print" style="max-width:210mm;margin:16px auto 0;padding:10px 16px;background:#FFFFFF;border:1px solid #D6D3D1;border-radius:8px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:0.76rem;color:#44403C;">' +
                '<span><strong>Montagem Modular:</strong> a Máscara Superior (Disco 3 · <em>Taxis</em>) é universal; acople o <strong>Disco 2-Ω</strong> aos Discos 1 em <strong>-ω</strong> ou o <strong>Disco 2-ΜΙ</strong> ao Disco Separado em <strong>-μι</strong>.</span>' +
                '<span class="font-mono">' + escHtml(printBundle.scale.marginNote) + '</span>' +
              '</div>' +
              '<div class="print-pages-stack">' + printBundle.pagesHtml + '</div>' +
            '</div>'
          );
          return;
        }

        var navItems = [
          { id: 'instrument', label: 'Instrumento' },
          { id: 'lexemes', label: 'Radicais (Discos)' },
          { id: 'topology', label: 'Janelas Taxis' },
          { id: 'math_data', label: 'Geometria & Dados' },
          { id: 'offline_html', label: 'Código HTML Único' }
        ];

        var navHtml = navItems.map(function (sec) {
          return '<button type="button" data-action="nav-section" data-section="' + sec.id + '" class="nav-tab' + (state.activeSection === sec.id ? ' active' : '') + '">' + escHtml(sec.label) + '</button>';
        }).join('');

        var deckTabsHtml = DECK_ORDER.map(function (deckId) {
          return '<button type="button" data-action="select-deck" data-deck="' + deckId + '" class="seg-btn' + (deckId === state.activeDeckId ? ' active' : '') + '">' + escHtml(DISC_DECK_METADATA[deckId].shortLabel) + '</button>';
        }).join('');

        var globalVerbOptions = [
          '<optgroup label="Roda em -ω · Série I">' +
            state.decks.omega_barytone.map(function (v, i) {
              var val = 'omega_barytone:' + i;
              var sel = (state.activeDeckId === 'omega_barytone' && state.selectedVerbIndex === i) ? ' selected' : '';
              return '<option value="' + val + '"' + sel + '>' + escHtml(v.lemma + ' — ' + v.gloss) + '</option>';
            }).join('') +
          '</optgroup>',
          '<optgroup label="Roda em -ω · Série II (Contratos -άω/-έω/-όω + φαίνω)">' +
            state.decks.omega_contract.map(function (v, i) {
              var val = 'omega_contract:' + i;
              var sel = (state.activeDeckId === 'omega_contract' && state.selectedVerbIndex === i) ? ' selected' : '';
              return '<option value="' + val + '"' + sel + '>' + escHtml(v.lemma + ' — ' + v.gloss) + '</option>';
            }).join('') +
          '</optgroup>',
          '<optgroup label="Disco Separado em -μι (Atemáticos Reduplicados)">' +
            state.decks.mi_athematic.map(function (v, i) {
              var val = 'mi_athematic:' + i;
              var sel = (state.activeDeckId === 'mi_athematic' && state.selectedVerbIndex === i) ? ' selected' : '';
              return '<option value="' + val + '"' + sel + '>' + escHtml(v.lemma + ' — ' + v.gloss) + '</option>';
            }).join('') +
          '</optgroup>'
        ].join('');

        var voiceBtnsHtml = VOICES_ORDER.map(function (vId) {
          var mult = VOICE_METADATA[vId].stepMultiplier;
          var deg = Number((mult * rotation.voiceStepDeg).toFixed(1));
          var degStr = deg > 0 ? '+' + deg : String(deg);
          return '<button type="button" data-action="select-voice" data-voice="' + vId + '" class="seg-btn' + (state.selectedVoice === vId ? ' active' : '') + '">' + VOICE_METADATA[vId].label + ' (' + degStr + '°)</button>';
        }).join('');

        var swatchesHtml = ['crimson', 'cobalt', 'bronze', 'obsidian'].map(function (pid) {
          var th = PIGMENT_THEMES[pid];
          return '<button type="button" data-action="select-pigment" data-pigment="' + pid + '" title="' + escHtml(th.label) + '" class="swatch-dot' + (state.pigmentId === pid ? ' active' : '') + '" style="background:' + th.hex + ';"></button>';
        }).join('');

        var asideContentHtml = '';
        if (state.activeSection === 'instrument') {
          asideContentHtml = renderInstrumentAsideHtml(currentVerb, selectedWindow, rotation, conjugationSystem, pigment);
        } else if (state.activeSection === 'lexemes') {
          asideContentHtml = renderLexemesAsideHtml(verbs, pigment);
        } else if (state.activeSection === 'topology') {
          asideContentHtml = renderTopologyAsideHtml(pigment);
        } else if (state.activeSection === 'math_data') {
          asideContentHtml = renderMathAndDataAsideHtml(verbs, rotation, conjugationSystem, pigment);
        } else if (state.activeSection === 'offline_html') {
          asideContentHtml = renderOfflineHtmlAsideHtml();
        }

        appRoot.innerHTML = (
          '<div class="hidden-print-mount">' + printBundle.pagesHtml + '</div>' +
          '<div class="no-print">' +
            '<header class="top-header">' +
              '<a href="#volvella" data-action="nav-section" data-section="instrument" class="brand-link">Volvella Grammatica</a>' +
              '<nav class="top-nav" aria-label="Seções do Estúdio">' + navHtml + '</nav>' +
              '<div class="header-actions">' +
                '<button type="button" data-action="quick-download-html" class="btn btn-secondary">Baixar HTML Único</button>' +
                '<button type="button" data-action="open-print-view" class="btn btn-primary">Imprimir Moldes A4</button>' +
              '</div>' +
            '</header>' +

            '<main class="studio-main">' +
              '<section class="card stage-card">' +
                '<div class="toolbar-row">' +
                  '<div class="segmented-group" role="tablist">' + deckTabsHtml + '</div>' +
                  '<div style="font-size:0.76rem;color:#78716C;">Anel acoplado: <strong style="color:#1C1917;">' +
                    (conjugationSystem === 'mi' ? 'Disco 2-ΜΙ (Desinências Atemáticas)' : 'Disco 2-Ω (Desinências Temáticas & Contratas)') +
                  '</strong></div>' +
                '</div>' +

                '<div class="toolbar-row">' +
                  '<div style="display:flex;align-items:center;gap:8px;">' +
                    '<span style="font-size:0.76rem;font-weight:500;color:#78716C;">Verbo:</span>' +
                    '<div class="verb-stepper">' +
                      '<button type="button" data-action="step-verb" data-delta="-1" class="step-arrow" aria-label="Verbo anterior">‹</button>' +
                      '<select data-input="global-verb" class="verb-select" aria-label="Selecionar verbo grego">' + globalVerbOptions + '</select>' +
                      '<button type="button" data-action="step-verb" data-delta="1" class="step-arrow" aria-label="Próximo verbo">›</button>' +
                    '</div>' +
                  '</div>' +

                  '<div style="display:flex;align-items:center;gap:8px;">' +
                    '<span style="font-size:0.76rem;font-weight:500;color:#78716C;">Disco 2 (' + (conjugationSystem === 'mi' ? '-μι' : '-ω') + '):</span>' +
                    '<div class="segmented-group">' + voiceBtnsHtml + '</div>' +
                  '</div>' +
                '</div>' +

                '<div style="width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;">' +
                  '<div style="font-size:0.78rem;color:#57534E;">' +
                    '<span style="font-weight:500;color:#78716C;">Temas Puros (I–VI): </span>' +
                    '<strong class="font-greek" style="font-size:0.95rem;color:#1C1917;">' + escHtml(getPrincipalStemsSummary(currentVerb).join(' · ')) + '</strong>' +
                  '</div>' +
                  '<div style="display:flex;align-items:center;gap:14px;">' +
                    '<div class="swatch-row">' + swatchesHtml + '</div>' +
                    '<button type="button" data-action="toggle-xray" class="btn ' + (state.xrayMode ? 'btn-primary' : 'btn-secondary') + ' btn-sm">' +
                      (state.xrayMode ? 'Raio-X Ativo' : 'Raio-X Hueber') +
                    '</button>' +
                  '</div>' +
                '</div>' +

                '<div class="volvella-svg-wrap">' +
                  renderVolvellaSvg(verbs, state.windows, rotation, conjugationSystem, pigment) +
                '</div>' +

                '<div class="stage-footer font-mono tabular-nums">' +
                  '<div>' +
                    'θ_Verbo: ' + rotation.thetaVerbDeg + '° · θ_Voz: ' + (rotation.thetaVoiceDeg > 0 ? '+' + rotation.thetaVoiceDeg : rotation.thetaVoiceDeg) + '° · ' +
                    '<strong style="color:' + pigment.hex + ';">Disco 1: ' + rotation.disc1StemCompensationDeg + '°</strong>' +
                  '</div>' +
                  '<div style="font-family:var(--font-sans);">' + escHtml(activeDeckMeta.fullTitle) + ' (' + verbs.length + ' verbos · setores de ' + rotation.deltaVerbDeg + '°)</div>' +
                '</div>' +
              '</section>' +

              '<aside class="aside-stack">' + asideContentHtml + '</aside>' +
            '</main>' +
          '</div>'
        );
      }

      /* =========================================================================
         10. DELEGAÇÃO DE EVENTOS GLOBAL (ZERO DEPENDÊNCIAS EXTERNAS)
         ========================================================================= */
      function stepVerb(delta) {
        var sys = DISC_DECK_METADATA[state.activeDeckId].system;
        if (sys === 'omega') {
          var pool = [];
          state.decks.omega_barytone.forEach(function (_, i) { pool.push({ deckId: 'omega_barytone', idx: i }); });
          state.decks.omega_contract.forEach(function (_, i) { pool.push({ deckId: 'omega_contract', idx: i }); });
          if (!pool.length) return;
          var curPos = pool.findIndex(function (p) { return p.deckId === state.activeDeckId && p.idx === state.selectedVerbIndex; });
          var nextPos = ((curPos >= 0 ? curPos : 0) + delta + pool.length) % pool.length;
          state.activeDeckId = pool[nextPos].deckId;
          state.selectedVerbIndex = pool[nextPos].idx;
        } else {
          var list = state.decks[state.activeDeckId] || [];
          if (!list.length) return;
          state.selectedVerbIndex = (state.selectedVerbIndex + delta + list.length) % list.length;
        }
      }

      function copyTextReliable(text, fallbackTextareaId) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(function () {
            var ta = fallbackTextareaId ? document.getElementById(fallbackTextareaId) : null;
            if (ta) { ta.focus(); ta.select(); try { document.execCommand('copy'); } catch (_) {} }
          });
          return;
        }
        var el = fallbackTextareaId ? document.getElementById(fallbackTextareaId) : null;
        if (el) {
          el.focus();
          el.select();
          try { document.execCommand('copy'); } catch (_) {}
        }
      }

      document.addEventListener('click', function (e) {
        if (e.target && e.target.id === 'unified-html-textarea') {
          e.target.select();
          return;
        }

        var btn = e.target && e.target.closest ? e.target.closest('[data-action]') : null;
        if (!btn) return;

        var action = btn.getAttribute('data-action');
        if (btn.tagName === 'A') e.preventDefault();

        if (action === 'nav-section') {
          state.activeSection = btn.getAttribute('data-section') || 'instrument';
          state.statusBanner = '';
          renderApp();
        } else if (action === 'select-deck') {
          state.activeDeckId = btn.getAttribute('data-deck') || 'omega_barytone';
          state.selectedVerbIndex = 0;
          var firstV = (state.decks[state.activeDeckId] || [])[0];
          state.expandedLexemeId = firstV ? firstV.id : '';
          renderApp();
        } else if (action === 'select-verb') {
          state.selectedVerbIndex = Number(btn.getAttribute('data-index')) || 0;
          renderApp();
        } else if (action === 'step-verb') {
          stepVerb(Number(btn.getAttribute('data-delta')) || 1);
          renderApp();
        } else if (action === 'select-voice') {
          state.selectedVoice = btn.getAttribute('data-voice') || 'active';
          renderApp();
        } else if (action === 'select-window') {
          state.selectedWindowId = btn.getAttribute('data-win-id') || 'w1';
          renderApp();
        } else if (action === 'select-pigment') {
          state.pigmentId = btn.getAttribute('data-pigment') || 'crimson';
          renderApp();
        } else if (action === 'toggle-xray') {
          state.xrayMode = !state.xrayMode;
          renderApp();
        } else if (action === 'open-print-view') {
          state.isPrintView = true;
          renderApp();
        } else if (action === 'close-print-view') {
          state.isPrintView = false;
          renderApp();
        } else if (action === 'trigger-browser-print') {
          window.print();
        } else if (action === 'quick-download-html' || action === 'download-unified-html') {
          var htmlCode = buildStandaloneUnifiedHtml(state.includeEditsInHtml);
          var sizeKb = triggerDownloadBlob(htmlCode, 'volvella-grammatica.html', 'text/html;charset=utf-8');
          state.activeSection = 'offline_html';
          state.statusBanner = 'Arquivo volvella-grammatica.html (' + sizeKb + ' KB) gerado! Caso o navegador bloqueie downloads em pré-visualização, clique em "Copiar Código HTML Integral" acima e salve como volvella.html.';
          renderApp();
        } else if (action === 'copy-unified-html') {
          var fullCode = buildStandaloneUnifiedHtml(state.includeEditsInHtml);
          copyTextReliable(fullCode, 'unified-html-textarea');
          state.statusBanner = 'Código HTML integral copiado para a área de transferência! Cole em qualquer editor de texto e salve com extensão .html.';
          renderApp();
        } else if (action === 'toggle-lexeme') {
          var vid = btn.getAttribute('data-verb-id') || '';
          state.selectedVerbIndex = Number(btn.getAttribute('data-index')) || 0;
          state.expandedLexemeId = state.expandedLexemeId === vid ? '' : vid;
          renderApp();
        } else if (action === 'create-verb') {
          var isMi = DISC_DECK_METADATA[state.activeDeckId].system === 'mi';
          var newId = 'verb_' + Date.now();
          var created = isMi
            ? {
                id: newId, lemma: 'δείκνυμι', gloss: 'mostrar, revelar', conjugationSystem: 'mi',
                stems: { I: 'δεικνυ', II: 'δειξ', III: 'δειξ', IV: 'δεδειχ', V: 'δεδειγ', VI: 'δειχθ' },
                augmentedStems: { I_aug: 'ἐδεικνυ', III_aug: 'ἐδειξ', III_mid_aug: 'ἐδειξα', IV_aug: 'ἐδεδειχ', V_aug: 'ἐδεδειγ', VI_aug: 'ἐδειχθ' },
                augmentLabel: 'ἐ- (silábico)', aoristVariant: 'sigmatic', stemVConsonant: 'velar'
              }
            : {
                id: newId, lemma: 'κελεύω', gloss: 'ordenar, exortar', conjugationSystem: 'omega',
                stems: { I: 'κελευ', II: 'κελευσ', III: 'κελευσ', IV: 'κεκελευκ', V: 'κεκελευσ', VI: 'κελευσθ' },
                augmentedStems: { I_aug: 'ἐκελευ', III_aug: 'ἐκελευσ', IV_aug: 'ἐκεκελευκ', V_aug: 'ἐκεκελευσ', VI_aug: 'ἐκελευσθ' },
                augmentLabel: 'ἐ- (silábico)', aoristVariant: 'sigmatic', stemVConsonant: 'dental'
              };
          state.decks[state.activeDeckId].push(created);
          state.selectedVerbIndex = state.decks[state.activeDeckId].length - 1;
          state.expandedLexemeId = newId;
          renderApp();
        } else if (action === 'add-preset-verb') {
          var pid = btn.getAttribute('data-preset-id');
          var found = EXTRA_PRESET_VERBS.find(function (p) { return p.id === pid; });
          if (found) {
            state.decks[state.activeDeckId].push(deepClone(found));
            state.selectedVerbIndex = state.decks[state.activeDeckId].length - 1;
            state.expandedLexemeId = found.id;
            renderApp();
          }
        } else if (action === 'remove-verb') {
          var remId = btn.getAttribute('data-verb-id');
          var curList = state.decks[state.activeDeckId];
          if (curList.length > 1) {
            state.decks[state.activeDeckId] = curList.filter(function (v) { return v.id !== remId; });
            state.selectedVerbIndex = Math.min(state.selectedVerbIndex, state.decks[state.activeDeckId].length - 1);
            renderApp();
          }
        } else if (action === 'prefill-augment') {
          var augVid = btn.getAttribute('data-verb-id');
          var targetVerb = state.decks[state.activeDeckId].find(function (v) { return v.id === augVid; });
          if (targetVerb) {
            targetVerb.augmentedStems.I_aug = 'ἐ' + targetVerb.stems.I;
            targetVerb.augmentedStems.III_aug = 'ἐ' + targetVerb.stems.III;
            targetVerb.augmentedStems.IV_aug = 'ἐ' + targetVerb.stems.IV;
            targetVerb.augmentedStems.V_aug = 'ἐ' + targetVerb.stems.V;
            targetVerb.augmentedStems.VI_aug = 'ἐ' + targetVerb.stems.VI;
            renderApp();
          }
        } else if (action === 'reset-deck') {
          state.decks[state.activeDeckId] = deepClone(INITIAL_DECKS[state.activeDeckId]);
          state.selectedVerbIndex = 0;
          renderApp();
        } else if (action === 'add-window') {
          var nw = { id: 'w_' + Date.now(), slotKey: 'pres_ind', name: 'Nova Janela Taxis', greekSubtitle: 'Νέα Θυρίς', hemisphere: 'primary_axis', x: 0, y: -75, stemWidth: 43, desinenceWidth: 59, height: 28 };
          state.windows.push(nw);
          state.selectedWindowId = nw.id;
          renderApp();
        } else if (action === 'remove-window') {
          var wid = btn.getAttribute('data-win-id');
          if (state.windows.length > 1) {
            state.windows = state.windows.filter(function (w) { return w.id !== wid; });
            if (state.selectedWindowId === wid) state.selectedWindowId = state.windows[0].id;
            renderApp();
          }
        } else if (action === 'reset-windows') {
          state.windows = deepClone(DEFAULT_WINDOWS);
          state.selectedWindowId = 'w1';
          renderApp();
        } else if (action === 'copy-csv') {
          var curVerbs = state.decks[state.activeDeckId];
          var curSys = DISC_DECK_METADATA[state.activeDeckId].system;
          copyTextReliable(exportMatrixAsSemicolonCSV(curVerbs, state.windows, state.preferredVoiceStepDeg, curSys), '');
        } else if (action === 'download-csv') {
          var dlVerbs = state.decks[state.activeDeckId];
          var dlSys = DISC_DECK_METADATA[state.activeDeckId].system;
          triggerDownloadBlob(exportMatrixAsSemicolonCSV(dlVerbs, state.windows, state.preferredVoiceStepDeg, dlSys), 'volvella_' + state.activeDeckId + '.csv', 'text/csv;charset=utf-8');
        } else if (action === 'copy-json') {
          var jStr = JSON.stringify({ decksDisc1: state.decks, desinencePlatesDisc2: { omega: HUEBER_DESINENCE_PLATES, mi: HUEBER_MI_DESINENCE_PLATES } }, null, 2);
          copyTextReliable(jStr, '');
        } else if (action === 'toggle-json-import') {
          state.jsonImportOpen = !state.jsonImportOpen;
          state.jsonDraft = JSON.stringify({ lexemesDisc1: state.decks[state.activeDeckId] }, null, 2);
          state.jsonImportError = '';
          renderApp();
        } else if (action === 'apply-json-import') {
          var box = document.getElementById('json-import-box');
          var rawText = box ? box.value : state.jsonDraft;
          try {
            var parsed = JSON.parse(rawText);
            var list = Array.isArray(parsed) ? parsed : (parsed.lexemesDisc1 || parsed.lexemes);
            if (!Array.isArray(list) || !list.length) {
              state.jsonImportError = 'O JSON deve conter um array "lexemesDisc1" com pelo menos um verbo.';
            } else {
              state.decks[state.activeDeckId] = list;
              state.selectedVerbIndex = 0;
              state.jsonImportOpen = false;
              state.jsonImportError = '';
            }
          } catch (_) {
            state.jsonImportError = 'Sintaxe JSON inválida. Verifique chaves e aspas.';
          }
          renderApp();
        }
      });

      document.addEventListener('change', function (e) {
        var t = e.target;
        if (!t) return;
        var inp = t.getAttribute('data-input');

        if (inp === 'global-verb') {
          var parts = String(t.value).split(':');
          if (state.decks[parts[0]]) {
            state.activeDeckId = parts[0];
            state.selectedVerbIndex = Number(parts[1]) || 0;
            renderApp();
          }
        } else if (inp === 'kerning') {
          state.kerningPx = Number(t.value) || 1.2;
          renderApp();
        } else if (inp === 'voice-step') {
          state.preferredVoiceStepDeg = Number(t.value) || 20;
          renderApp();
        } else if (inp === 'include-edits') {
          state.includeEditsInHtml = !!t.checked;
          renderApp();
        } else if (inp === 'print-scope') {
          state.printScopeId = t.value;
          renderApp();
        } else if (inp === 'print-scale') {
          state.printScaleId = t.value;
          renderApp();
        } else if (t.hasAttribute('data-verb-field')) {
          var vf = t.getAttribute('data-verb-field');
          var vid = t.getAttribute('data-verb-id');
          var vObj = state.decks[state.activeDeckId].find(function (v) { return v.id === vid; });
          if (vObj) { vObj[vf] = t.value; renderApp(); }
        } else if (t.hasAttribute('data-verb-stem')) {
          var sk = t.getAttribute('data-verb-stem');
          var svid = t.getAttribute('data-verb-id');
          var svObj = state.decks[state.activeDeckId].find(function (v) { return v.id === svid; });
          if (svObj) { svObj.stems[sk] = t.value; renderApp(); }
        } else if (t.hasAttribute('data-verb-aug')) {
          var ak = t.getAttribute('data-verb-aug');
          var avid = t.getAttribute('data-verb-id');
          var avObj = state.decks[state.activeDeckId].find(function (v) { return v.id === avid; });
          if (avObj) { avObj.augmentedStems[ak] = t.value; renderApp(); }
        } else if (t.hasAttribute('data-win-field')) {
          var wf = t.getAttribute('data-win-field');
          var wid = t.getAttribute('data-win-id');
          var wObj = state.windows.find(function (w) { return w.id === wid; });
          if (wObj) { wObj[wf] = t.value; renderApp(); }
        } else if (t.hasAttribute('data-win-num')) {
          var wn = t.getAttribute('data-win-num');
          var nwid = t.getAttribute('data-win-id');
          var nwObj = state.windows.find(function (w) { return w.id === nwid; });
          if (nwObj) {
            var val = Number(t.value) || 0;
            if (wn === 'stemWidth') val = Math.max(20, val);
            if (wn === 'desinenceWidth') val = Math.max(24, val);
            if (wn === 'height') val = Math.max(18, val);
            nwObj[wn] = val;
            renderApp();
          }
        }
      });

      renderApp();
    })();
  </script>
</body>
